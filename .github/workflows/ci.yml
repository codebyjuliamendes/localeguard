name: CI
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run coverage
      - run: npm run build
      - name: CLI smoke test (compiled)
        run: node dist/cli/index.js --base locales/en-US.json --dir locales

  docker:
    name: Docker image + smoke test
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t localeguard:ci .
      - name: Run container and probe the API
        run: |
          docker run -d --name lg -p 3007:3007 localeguard:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3007/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3007/api/health | grep '"ok":true'
          curl -fsS http://127.0.0.1:3007/api/workspace | grep 'Orbit Workspace'
          curl -fsS -X POST http://127.0.0.1:3007/api/projects/1/scan | grep '"scanId"'
          curl -fsSI http://127.0.0.1:3007/ | grep -i "content-security-policy"
          curl -fsS http://127.0.0.1:3007/app.js > /dev/null
          docker exec lg id -u | grep -v '^0$'
          docker stop -t 15 lg
          docker logs lg | tail -5
          docker logs lg | grep -q 'shutdown complete'
