name: Localization checks
on:
  pull_request:
  push:
    branches: [master]
jobs:
  catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm test
      - run: npm run locale:check -- --base locales/en-US.json --locale de-DE --file locales/de-DE.json
