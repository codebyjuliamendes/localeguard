name: Localization checks
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  catalogs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check every catalog in locales/ against en-US
        run: npm run locale:check -- --base locales/en-US.json --dir locales --fail-on warning
      - name: Export the JSON report
        if: always()
        run: npm run --silent locale:check -- --base locales/en-US.json --dir locales --format json --fail-on none > locale-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: locale-report
          path: locale-report.json
